# ------------------------------------------------------------------
#  Luckymod configuration
# ------------------------------------------------------------------
#  A "lucky block" is a normal vanilla block (no client mod needed).
#  Place it, break it, and a weighted random outcome triggers.
#
#  Each outcome has: type, category (GOOD|NEUTRAL|BAD), weight, message.
#  The block's LUCK (-100..100) biases GOOD/BAD odds.
#
#  Types: ITEM | MOB | EFFECT | TRAP | STRUCTURE | ACTION | FALLING | APOCALYPSE | SPECIAL
#  See the reference blocks below for the per-type fields.
#
#  This default set mirrors the classic Base Lucky Block mod outcomes.
#  Notes on fidelity are in comments; a few meta events (wishing well interaction,
#  giant lucky block) are approximated or left out where no clean vanilla equivalent exists.
# ------------------------------------------------------------------

prefix: "&6[Lucky] &r"

block:
  material: SPONGE

effects:
  sounds: true

recipe:
  enabled: true
  shape:
    - "GGG"
    - "GXG"
    - "GGG"
  ingredients:
    G: GOLD_INGOT
    X: DROPPER

upgrades:
  enabled: true
  catalysts:
    DIAMOND: 10
    EMERALD: 8
    GOLD_BLOCK: 5
    IRON_BLOCK: 3
    ROTTEN_FLESH: -10
    COAL: -5
    DEAD_BUSH: -8

# Field reference (all optional unless noted):
#   ITEM      : items:[...], pool:[...], min:, max:, name:, lore:[...], launch:true,
#               enchants:{NAME:level}, randomEnchantments:true, enchantCount:, enchantMaxLevel:
#   MOB       : mob:, min:, max:, name:, size:, charged:true, tamed:true, baby:true,
#               collar:RED, rabbitType:THE_KILLER_BUNNY, equipment:{helmet,chest,legs,boots,hand,offhand}
#   EFFECT    : effect:, duration:seconds, amplifier:
#   TRAP      : trap:EXPLOSION|LIGHTNING|FIRE|ANVIL|TNT|ARROW_RAIN|LAVA|WEB|WATER|CAGE, target:BLOCK|PLAYER, value:
#   STRUCTURE : structure:CAGE|OBSIDIAN_BOX|GLASS_BOX|PLATFORM|TREE|LOOT_CHEST, target:, material:, value:, items:[...]
#   ACTION    : action:HEAL|FEED|XP|LAUNCH|TELEPORT|IGNITE|WEATHER_CLEAR|WEATHER_RAIN|THUNDER|TIME_DAY|TIME_NIGHT, value:
#   FALLING   : fallingMaterial:, topMaterial:, height:, count:, spread:, lightning:true
#   APOCALYPSE: groups:[{mob:,min:,max:}], difficultyHard:, midnight:, giveWoodenSword:, slowness:, blindness:
#   SPECIAL   : special:SLIME_CASTLE|HERO_VILLAGER|ARMOR_STAND_BABY|RAINBOW_SHEEP|TNT_AIR_LAUNCH|WITCH_BATS|MOB_STACK|TNT_TOWER|TWO_BLOCKS|BEDROCK_SIGN, preset:, value:

